<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GM Mandarin — Arsip Video Ad Briefs</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--brand:#123A73;--deep:#0A2650;--azure:#1E86C9;--gold:#A9781A;--goldsolid:#E0A93A;--goldbg:#FBF4DE;
        --bg:#F4F8FC;--card:#FFFFFF;--ink:#39445A;--gray:#7B8798;--line:#E4EBF3}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;
       -webkit-font-smoothing:antialiased;padding:56px 22px 72px}
  .wrap{max-width:840px;margin:0 auto}
  .brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px;letter-spacing:-.01em}
  .brand .gm{color:var(--brand)} .brand .md{color:var(--goldsolid)}
  .brand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--azure));position:relative;flex-shrink:0}
  .brand .mark::after{content:"";position:absolute;right:6px;top:6px;width:11px;height:11px;background:var(--goldsolid);border-radius:2px}
  h1{font-size:38px;font-weight:900;color:var(--deep);letter-spacing:-.02em;margin:26px 0 8px;line-height:1.05}
  .lead{font-size:17px;color:var(--gray);font-weight:500;line-height:1.5;max-width:560px}
  .divider{height:1px;background:var(--line);margin:34px 0 26px}
  .sec{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--brand);margin-bottom:16px}
  .list{display:flex;flex-direction:column;gap:16px}
  .batch{display:flex;align-items:center;gap:22px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 26px;box-shadow:0 12px 32px rgba(18,58,115,.06);transition:.16s}
  .batch.live:hover{transform:translateY(-2px);box-shadow:0 18px 44px rgba(18,58,115,.12);border-color:#CFE0F2}
  .bnum{width:60px;height:60px;flex-shrink:0;border-radius:14px;background:linear-gradient(135deg,var(--brand),var(--azure));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;line-height:1}
  .bnum small{font-size:10px;font-weight:700;letter-spacing:.1em;opacity:.85;margin-top:2px}
  .bnum b{font-size:24px}
  .bbody{flex:1;min-width:0}
  .btitle{font-size:21px;font-weight:800;color:var(--deep)}
  .bmeta{font-size:14.5px;color:var(--gray);font-weight:500;margin-top:4px}
  .btags{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
  .bt{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--goldbg);color:var(--gold)}
  .bt.blue{background:#E6F1FB;color:#185FA5}
  .go{flex-shrink:0;display:inline-flex;align-items:center;gap:7px;background:var(--azure);color:#fff;font-size:15px;font-weight:800;padding:12px 22px;border-radius:11px;text-decoration:none;transition:.15s;white-space:nowrap}
  .go:hover{background:var(--brand)}
  .batch.soon{opacity:.72;border-style:dashed}
  .batch.soon .bnum{background:#E4EBF3;color:var(--gray)}
  .soonbadge{flex-shrink:0;font-size:13px;font-weight:700;color:var(--gray);background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:11px 20px}
  .batch.checking .soonbadge{animation:pulse 1.3s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  @media(max-width:620px){
    body{padding:36px 16px 56px}
    h1{font-size:30px}
    .batch{flex-wrap:wrap;gap:16px}
    .go,.soonbadge{width:100%;justify-content:center}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="mark"></span><span><span class="gm">gm</span><span class="md">mandarin</span></span></div>
  <h1>Video Ad Briefs</h1>
  <p class="lead">Arsip batch brief konten iklan video GM Mandarin. Tiap batch = satu set brief siap kasih ke kreator. Pilih batch di bawah.</p>
  <div class="divider"></div>
  <div class="sec">Daftar Batch</div>
  <div class="list" id="list">
    <!-- diisi otomatis oleh script di bawah -->
  </div>

</div>

<script>
  // ====== DAFTAR BATCH ======
  // Tambah batch baru = copy 1 objek di bawah, isi num/month/title/meta/tags/file.
  // "file" WAJIB sama persis dengan nama file deck yang bakal di-upload ke repo ini.
  // Status live/soon TIDAK perlu diisi manual — otomatis dicek oleh script di bawah.
  const BATCHES = [
    {
      num: '01', month: 'AGT',
      title: 'Batch 1 · Agustus 2026',
      meta: '5 video · 2 kelas dewasa + 3 kelas anak · 9:16 · mode Lean',
      tags: [
        { label: 'Layer warm L3/L4/L5', cls: 'blue' },
        { label: 'Offer: kelas coba gratis' }
      ],
      file: 'batch-01-agustus.html'
    },
    {
      num: '02', month: 'SEP',
      title: 'Batch 2 · September 2026',
      meta: '5 video · 3 hardsell + 2 organik IG · 9:16',
      tags: [
        { label: 'Konsep A-3 + A-1' },
        { label: 'Offer: trial gratis', cls: 'blue' }
      ],
      file: 'batch-02-september.html'
    },
    {
      num: '03', month: 'OKT',
      title: 'Batch 3 · Oktober 2026',
      meta: '5 video · hardsell iklan Form · konsep Peluang masa depan · 9:16 · mode Lean',
      tags: [
        { label: 'Peluang + Pendidikan lanjut' },
        { label: 'Offer: trial 1 sesi gratis', cls: 'blue' }
      ],
      file: 'batch-03-oktober.html'
    }
    // Tambah baris berikutnya di sini kalau mau siapin slot November, dst.
  ];

  // Cek apakah sebuah file ada di repo ini (HEAD dulu, fallback GET kalau host-nya nolak HEAD).
  async function fileExists(url) {
    try {
      const head = await fetch(url, { method: 'HEAD', cache: 'no-store' });
      if (head.ok) return true;
      if (head.status === 405 || head.status === 501) {
        const get = await fetch(url, { method: 'GET', cache: 'no-store' });
        return get.ok;
      }
      return false;
    } catch (e) {
      return false;
    }
  }

  function tagsHtml(tags) {
    return (tags || []).map(function (t) {
      return '<span class="bt' + (t.cls ? ' ' + t.cls : '') + '">' + t.label + '</span>';
    }).join('');
  }

  function renderChecking(b) {
    return '' +
      '<div class="batch soon checking">' +
        '<div class="bnum"><b>' + b.num + '</b><small>' + b.month + '</small></div>' +
        '<div class="bbody">' +
          '<div class="btitle">' + b.title + '</div>' +
          '<div class="bmeta">Memeriksa apakah file sudah di-upload…</div>' +
        '</div>' +
        '<span class="soonbadge">Memeriksa…</span>' +
      '</div>';
  }

  function renderRow(b, exists) {
    if (exists) {
      var tg = tagsHtml(b.tags);
      return '' +
        '<div class="batch live">' +
          '<div class="bnum"><b>' + b.num + '</b><small>' + b.month + '</small></div>' +
          '<div class="bbody">' +
            '<div class="btitle">' + b.title + '</div>' +
            '<div class="bmeta">' + b.meta + '</div>' +
            (tg ? '<div class="btags">' + tg + '</div>' : '') +
          '</div>' +
          '<a class="go" href="' + b.file + '">Buka deck →</a>' +
        '</div>';
    }
    return '' +
      '<div class="batch soon">' +
        '<div class="bnum"><b>' + b.num + '</b><small>' + b.month + '</small></div>' +
        '<div class="bbody">' +
          '<div class="btitle">' + b.title + '</div>' +
          '<div class="bmeta">Menyusul — file belum di-upload</div>' +
        '</div>' +
        '<span class="soonbadge">Segera</span>' +
      '</div>';
  }

  (async function init() {
    var list = document.getElementById('list');
    list.innerHTML = BATCHES.map(renderChecking).join('');
    var rows = list.querySelectorAll('.batch');
    var results = await Promise.all(BATCHES.map(function (b) { return fileExists(b.file); }));
    BATCHES.forEach(function (b, i) {
      rows[i].outerHTML = renderRow(b, results[i]);
    });
  })();
</script>
</body>
</html>
